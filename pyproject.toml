[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-test-framework"
version = "0.1.0"
description = "Production-minded QA automation framework showcasing SDET and test architecture practices."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Ssamoustafa"}]
dependencies = [
  "pytest>=8.3",
  "playwright>=1.48",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "PyYAML>=6.0",
  "allure-pytest>=2.13",
]

[project.optional-dependencies]
dev = [
  "pytest-xdist>=3.6",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "ruff>=0.7",
  "mypy>=1.13",
  "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["atlas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "smoke: critical-path checks",
  "regression: broader regression coverage",
  "api: HTTP/API tests",
  "e2e: browser end-to-end tests",
  "integration: integration tests",
]
